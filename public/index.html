<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reader</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="h-dvh overflow-hidden">
    <div class="drawer lg:drawer-open h-dvh">
      <input id="nav" type="checkbox" class="drawer-toggle" />

      <div class="drawer-content flex flex-col h-dvh overflow-hidden">
        <header class="navbar border-b border-base-300 gap-2 shrink-0 px-3">
          <label for="nav" class="btn btn-ghost btn-sm btn-square lg:hidden" aria-label="Toggle navigation">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </label>

          <div class="min-w-0">
            <p id="doc-title" class="font-medium truncate">Reader</p>
            <p id="doc-path" class="text-xs text-base-content/50 truncate">pick a document</p>
          </div>

          <div class="flex-1"></div>

          <span id="live-badge" class="badge badge-sm badge-ghost hidden">updated</span>
          <button id="reload" class="btn btn-ghost btn-sm" title="Re-read this file from disk">Reload</button>
        </header>

        <main id="pane" class="flex-1 overflow-y-auto scroll-smooth">
          <div id="empty" class="hero h-full">
            <div class="hero-content text-center">
              <div class="max-w-md">
                <h1 class="text-2xl font-semibold">Your plan docs</h1>
                <p class="text-base-content/60 mt-2">
                  Everything under <code class="kbd kbd-sm">.opencode</code>,
                  <code class="kbd kbd-sm">.superpowers</code> and <code class="kbd kbd-sm">docs</code>
                  across your projects. Search on the left, or press <kbd class="kbd kbd-sm">/</kbd>.
                </p>
                <p id="empty-count" class="text-sm text-base-content/40 mt-4"></p>
              </div>
            </div>
          </div>
          <article id="doc" class="hidden prose max-w-4xl mx-auto px-6 py-8"></article>
        </main>
      </div>

      <div class="drawer-side z-20">
        <label for="nav" aria-label="close sidebar" class="drawer-overlay"></label>
        <aside class="bg-base-200 h-dvh w-80 flex flex-col">
          <div class="p-3 border-b border-base-300 space-y-2 shrink-0">
            <label class="input input-sm w-full">
              <svg class="size-4 opacity-40" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" d="m21 21-4.3-4.3M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z" />
              </svg>
              <input id="search" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false" />
            </label>
            <div class="flex items-center gap-1">
              <button id="refresh" class="btn btn-ghost btn-xs">Rescan</button>
              <button id="add-root" class="btn btn-ghost btn-xs">Add folder</button>
              <span id="count" class="ml-auto text-xs text-base-content/50"></span>
            </div>
          </div>

          <div id="tree" class="w-full flex-1 overflow-y-auto p-2 space-y-0.5"></div>

          <div id="roots" class="border-t border-base-300 p-2 space-y-1 shrink-0 empty:hidden"></div>
        </aside>
      </div>
    </div>

    <dialog id="root-dialog" class="modal">
      <div class="modal-box">
        <h3 class="font-semibold text-lg">Add a folder</h3>
        <p class="text-sm text-base-content/60 mt-1">
          Scanned for markdown alongside the default directories. Use an absolute path or <code>~/</code>.
        </p>
        <input id="root-input" class="input input-sm w-full mt-4" placeholder="~/projects/work/web/design-notes" spellcheck="false" />
        <p id="root-error" class="text-error text-sm mt-2 hidden"></p>
        <div class="modal-action">
          <form method="dialog"><button class="btn btn-ghost btn-sm">Cancel</button></form>
          <button id="root-save" class="btn btn-sm">Add</button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
